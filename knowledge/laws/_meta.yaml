# Метаданные папки knowledge/laws/
# Действующие законы РК (не налоговые) для RAG-индексации.

purpose: |
  Первоисточники общеотраслевого законодательства РК.
  Используются для AI-консультаций (Mini App), генерации тестов в Академии,
  ссылок в обзорах ниш, проверки compliance в FinModel и BizPlan.

content_layout: "Один файл = один закон. Frontmatter содержит дату, номер, sha256 исходника."

added_at: "2026-05-08"
added_by: Ноа

